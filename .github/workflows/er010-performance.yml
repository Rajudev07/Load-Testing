name: ER-010 Performance

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to performance-test"
        required: true
        type: string
      correlation_id:
        description: "ZeroUI correlation ID for this evaluation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  er010-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify exact commit
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Requested SHA: ${{ inputs.target_sha }}"
          echo "Checked out SHA: $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "${{ inputs.target_sha }}" ]; then
            echo "Checked-out commit does not match requested target_sha"
            exit 1
          fi

      - name: Start application
        run: |
          python app/server.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Application did not become ready"
          cat app.log || true
          exit 1

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run ER-010 load test
        run: |
          k6 run \
            --summary-export=performance/k6-summary.json \
            performance/er010.js

      - name: Build ER-010 evidence
        env:
          ER010_CORRELATION_ID: ${{ inputs.correlation_id }}
          ER010_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          python performance/build_result.py

      - name: Upload ER-010 evidence
        uses: actions/upload-artifact@v4
        with:
          name: er010-performance-result
          path: er010-performance-result.json
          if-no-files-found: error